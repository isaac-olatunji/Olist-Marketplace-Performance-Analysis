<svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0F2240"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F4E79"/>
      <stop offset="100%" stop-color="#5B9BD5"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8C97A"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1A2C4D" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)" opacity="0.4"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="500" fill="url(#accentBlue)"/>

  <!-- Gold top accent line -->
  <rect x="80" y="56" width="180" height="3" fill="url(#accentGold)"/>

  <!-- Eyebrow -->
  <text x="80" y="46" font-family="'Courier New', monospace" font-size="14"
        fill="#C9A84C" letter-spacing="3">SQL · POWER BI · END-TO-END BI</text>

  <!-- Main title — reduced to 58px so both lines stay left of divider -->
  <text x="80" y="138" font-family="Georgia, 'Times New Roman', serif"
        font-size="58" font-weight="700" fill="#F4F6FA">Olist Marketplace</text>
  <text x="80" y="208" font-family="Georgia, 'Times New Roman', serif"
        font-size="58" font-weight="700" fill="#F4F6FA">Performance Analysis</text>

  <!-- Subtitle -->
  <text x="80" y="248" font-family="Arial, Helvetica, sans-serif" font-size="18"
        fill="#8DA3C4">Business Intelligence &amp; E-Commerce Analytics</text>

  <!-- Pipeline strip -->
  <rect x="80" y="272" width="640" height="1" fill="#2A4A6A"/>
  <g font-family="'Courier New', monospace" font-size="12" fill="#4A7FAA">
    <text x="80"  y="290">MySQL</text>
    <text x="152" y="290">→</text>
    <text x="168" y="290">Star Schema</text>
    <text x="282" y="290">→</text>
    <text x="298" y="290">Power Query</text>
    <text x="416" y="290">→</text>
    <text x="432" y="290">DAX</text>
    <text x="474" y="290">→</text>
    <text x="490" y="290">Power BI</text>
    <text x="578" y="290">→</text>
    <text x="594" y="290">Insights</text>
  </g>

  <!-- Bottom metrics strip -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="80"  y="370" font-size="30" font-weight="700" fill="#5B9BD5">$13.59M</text>
    <text x="80"  y="392" font-size="12" fill="#6B85AC" letter-spacing="1">TOTAL REVENUE</text>

    <text x="270" y="370" font-size="30" font-weight="700" fill="#5B9BD5">99K</text>
    <text x="270" y="392" font-size="12" fill="#6B85AC" letter-spacing="1">ORDERS</text>

    <text x="370" y="370" font-size="30" font-weight="700" fill="#5B9BD5">3K</text>
    <text x="370" y="392" font-size="12" fill="#6B85AC" letter-spacing="1">SELLERS</text>

    <text x="460" y="370" font-size="30" font-weight="700" fill="#5B9BD5">4.0</text>
    <text x="460" y="392" font-size="12" fill="#6B85AC" letter-spacing="1">AVG REVIEW</text>

    <text x="570" y="370" font-size="30" font-weight="700" fill="#5B9BD5">5</text>
    <text x="570" y="392" font-size="12" fill="#6B85AC" letter-spacing="1">DASHBOARD PAGES</text>
  </g>

  <!-- Author -->
  <text x="80" y="448" font-family="Arial, Helvetica, sans-serif"
        font-size="14" fill="#4A6184">isaactheanalyst</text>
  <text x="80" y="468" font-family="Arial, Helvetica, sans-serif"
        font-size="12" fill="#3A5070">Brazilian Olist E-Commerce Dataset · MySQL · Power BI · DAX</text>

  <!-- Vertical divider — moved right to 780 to give left side room -->
  <rect x="780" y="60" width="1" height="400" fill="#1E3A5F"/>

  <!-- Right panel — starts at x=820 -->
  <g font-family="Arial, Helvetica, sans-serif">

    <text x="820" y="100" font-size="12" fill="#6B85AC" letter-spacing="2">PROJECT SCOPE</text>
    <text x="820" y="128" font-size="16" fill="#8DA3C4">Sales · Products · Customers</text>
    <text x="820" y="150" font-size="16" fill="#8DA3C4">Sellers · Payments · Delivery</text>
    <text x="820" y="172" font-size="16" fill="#8DA3C4">Customer Experience</text>

    <text x="820" y="212" font-size="12" fill="#6B85AC" letter-spacing="2">DATA ENGINEERING</text>
    <text x="820" y="238" font-size="16" fill="#8DA3C4">MySQL → Star Schema Redesign</text>
    <text x="820" y="260" font-size="16" fill="#8DA3C4">Kimball Dimensional Model</text>
    <text x="820" y="282" font-size="16" fill="#8DA3C4">Payment &amp; Review Aggregation</text>
    <text x="820" y="304" font-size="16" fill="#8DA3C4">Grain Validation · SQL Views</text>

    <text x="820" y="344" font-size="12" fill="#6B85AC" letter-spacing="2">DATASET</text>
    <text x="820" y="370" font-size="16" fill="#8DA3C4">Brazilian Olist E-Commerce</text>
    <text x="820" y="392" font-size="16" fill="#8DA3C4">1.5M+ Records · 9 Source Files</text>
    <text x="820" y="414" font-size="16" fill="#8DA3C4">Sept 2016 – Sept 2018</text>
  </g>
</svg>
